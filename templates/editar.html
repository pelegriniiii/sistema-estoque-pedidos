{% extends "base.html" %}
{% block title %}Editar produto | Estoque+{% endblock %}
{% block content %}
<section class="cabecalho-pagina"><div><p class="sobretitulo">PRODUTOS</p><h1>Editar produto</h1><p class="subtitulo">Atualize as informações do item.</p></div></section>
<section class="painel formulario-painel">
  <form method="POST" class="formulario">
    <label>Nome do produto</label><input type="text" name="nome" value="{{ produto.nome }}" maxlength="100" required>
    <label>Preço (R$)</label><input type="number" name="preco" value="{{ produto.preco }}" min="0" step="0.01" required>
    <label>Quantidade disponível</label><input type="number" name="quantidade" value="{{ produto.quantidade }}" min="0" step="1" required>
    <div class="linha-botoes"><button class="botao" type="submit">Salvar alterações</button><a class="botao botao-secundario" href="{{ url_for('inicio') }}">Voltar</a></div>
  </form>
</section>
{% endblock %}
